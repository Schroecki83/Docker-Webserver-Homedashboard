services:
  app:
    image: home-dashboard:latest
    build: .
    container_name: home-dashboard
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - FRONIUS_BASE_URL=${FRONIUS_BASE_URL}
      - FRONIUS_USERNAME=${FRONIUS_USERNAME}
      - FRONIUS_PASSWORD=${FRONIUS_PASSWORD}
      - FRONIUS_BASELINE_DB_PATH=${FRONIUS_BASELINE_DB_PATH:-/app/data/fronius-baseline.db}
      - HEATPUMP_HISTORY_DB_PATH=${HEATPUMP_HISTORY_DB_PATH:-/app/data/heatpump-history.db}
      - LUXTRONIC_HOST=${LUXTRONIC_HOST}
      - LUXTRONIC_PORT=${LUXTRONIC_PORT}
      - LUXTRONIC_PASSWORD=${LUXTRONIC_PASSWORD}
      - SHELLY_HT_DEVICES=${SHELLY_HT_DEVICES}
      - SHELLY_GEN1_DEVICES=${SHELLY_GEN1_DEVICES}
      - SHELLY_CLOUD_API_URL=${SHELLY_CLOUD_API_URL}
      - SHELLY_CLOUD_AUTH_TOKEN=${SHELLY_CLOUD_AUTH_TOKEN}
      - HOMECONNECT_CLIENT_ID=${HOMECONNECT_CLIENT_ID}
      - HOMECONNECT_CLIENT_SECRET=${HOMECONNECT_CLIENT_SECRET}
      - HOMECONNECT_CACHE_SECONDS=${HOMECONNECT_CACHE_SECONDS:-600}
      - WEATHER_LAT=${WEATHER_LAT:-48.117930872502676}
      - WEATHER_LON=${WEATHER_LON:-14.86961950661282}
      - PORT=${PORT:-3001}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - timeout:2
      - attempts:3
    restart: unless-stopped